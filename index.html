<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 300px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; align-self: start; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; touch-action: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: crosshair; border-radius: 2px; outline: 2px solid transparent; outline-offset: -2px; }
    #grid[data-mode="paint"] .cell { cursor: pointer; }
    #grid[data-mode="stamp"] .cell { cursor: cell; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .brush-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .brush-row button { font-size: 13px; padding: 8px 4px; }
    .mode-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .mode-row button { font-size: 13px; padding: 9px 4px; }
    button.active { outline: 3px solid #1f1b16; outline-offset: -3px; }
    .subpanel { border: 1px dashed #cdbfaa; border-radius: 8px; padding: 10px; margin: 8px 0; background: #fffdf8; }
    .subpanel[hidden] { display: none; }
    .subpanel .inline { display: flex; gap: 6px; }
    .subpanel .inline input { flex: 1; }
    .subpanel .inline button { white-space: nowrap; }
    .hint { font-size: 13px; color: #76695e; margin: 6px 0; min-height: 38px; line-height: 1.5; }
    .sel-info { font-size: 13px; margin: 6px 0; }
    .repeat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .repeat-row label { margin-top: 0; }
    .blocks { display: grid; gap: 8px; margin-top: 8px; }
    .empty { font-size: 13px; color: #9a8c7c; border: 1px dashed #d9cdbc; border-radius: 8px; padding: 10px; }
    .block-card { border: 1px solid #e1d5c5; border-radius: 8px; padding: 8px 10px; background: #fffdf8; }
    .block-head { display: flex; align-items: center; gap: 6px; }
    .block-name { font-weight: 800; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .block-size { color: #9a8c7c; font-size: 12px; }
    .mini-btn { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .mini-btn.secondary { background: #9a8c7c; }
    .block-thumb-wrap { overflow-x: auto; margin: 6px 0 2px; }
    .block-thumb { display: grid; gap: 1px; width: max-content; border: 1px solid #d9cdbc; padding: 3px; background: #d9cdbc; border-radius: 4px; }
    .block-thumb .mini { width: 12px; height: 12px; display: block; }
    .block-repeat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
    .block-repeat label { display: flex; align-items: center; gap: 4px; margin: 4px 0 0; }
    .block-repeat input { padding: 5px 6px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status { min-height: 20px; font-size: 12px; color: #8d3e37; margin: 8px 0 0; line-height: 1.5; }
    .warning { color: #a03a2e; font-weight: 800; }
    .cell.selected { outline-color: rgba(31, 27, 22, .85); }
    .cell.stamp-hit { outline-color: rgba(141, 62, 55, .9); background-blend-mode: multiply; box-shadow: inset 0 0 0 1000px rgba(141, 62, 55, .28); }
    .cell.stamp-anchor { outline-color: #1f1b16; box-shadow: inset 0 0 0 1000px rgba(31, 27, 22, .25); }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，框选保存回纹/万字纹块，按横纵次数铺放，统计色线用量并保存方案。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn" style="width:100%;margin-top:8px">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础笔刷（填色模式）</h2>
      <div class="brush-row">
        <button type="button" data-brush="dot" class="secondary">单点</button>
        <button type="button" data-brush="cross" class="secondary">十字</button>
        <button type="button" data-brush="diamond" class="secondary">小菱形</button>
      </div>
      <h2>纹样块库</h2>
      <div class="blocks" id="blockList"></div>
    </aside>
    <section class="panel">
      <div class="grid" id="grid"></div>
    </section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="mode-row">
        <button type="button" id="modePaintBtn">填色</button>
        <button type="button" id="modeSelectBtn" class="secondary">框选存块</button>
        <button type="button" id="modeStampBtn" class="secondary">铺放</button>
      </div>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p class="hint" id="modeHint"></p>

      <div class="subpanel" id="selectPanel" hidden>
        <div class="sel-info" id="selInfo"></div>
        <div class="inline">
          <input id="blockName" type="text" maxlength="20" placeholder="纹样块名字，如：回纹3×3">
          <button type="button" id="saveSelBtn">保存块</button>
          <button type="button" id="cancelSelBtn" class="secondary">取消</button>
        </div>
      </div>

      <div class="subpanel" id="stampPanel" hidden>
        <div class="sel-info" id="stampName"></div>
        <div class="repeat-row">
          <label>横向次数<input id="stampRepeatX" type="number" min="1" max="99" value="1"></label>
          <label>纵向次数<input id="stampRepeatY" type="number" min="1" max="99" value="1"></label>
        </div>
        <p class="hint">红色为预显落点，深格为锚点（纹样块左上角）。</p>
        <button type="button" id="cancelStampBtn" class="secondary" style="width:100%">退出铺放</button>
      </div>

      <p class="status" id="statusMsg"></p>

      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>
  <script src="js/data.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
