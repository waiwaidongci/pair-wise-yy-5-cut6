<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 300px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; touch-action: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .grid.selecting .cell { cursor: crosshair; }
    .cell.selected { outline: 2px solid #8d3e37; outline-offset: -2px; box-shadow: inset 0 0 0 9999px rgba(255,255,255,.28); }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .hint { margin: 8px 0 0; color: #76695e; font-size: 13px; min-height: 18px; }
    .hidden { display: none; }
    .muted { color: #9a8d7e; font-size: 13px; margin: 6px 0; }
    .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
    .flash { color: #8d3e37; font-size: 12px; font-weight: 700; margin: 6px 0 0; }

    /* 纹样块资产列表 */
    .block-item { display: flex; align-items: center; gap: 10px; border: 1px solid #e1d5c5; background: #fff; border-radius: 8px; padding: 8px; cursor: pointer; }
    .block-item.active { border-color: #8d3e37; box-shadow: 0 0 0 1px #8d3e37; }
    .block-mini { display: grid; gap: 1px; width: 52px; height: 52px; flex: 0 0 52px; background: #72533c; padding: 2px; border-radius: 4px; }
    .block-mini-cell { border-radius: 1px; min-width: 0; min-height: 0; }
    .block-meta { display: grid; gap: 2px; flex: 1; min-width: 0; }
    .block-meta b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .block-meta span { font-size: 12px; color: #9a8d7e; }
    .block-del { padding: 2px 9px; background: #b05b52; border-radius: 6px; line-height: 1.2; }

    .tile-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile-form .wide { grid-column: 1 / -1; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，框选存块后横纵铺放，统计色线用量并保存方案。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn" style="margin-top:10px">新建网格</button>

      <h2>色线库</h2>
      <div class="palette" id="palette"></div>

      <h2>基础填色图章</h2>
      <div class="blocks">
        <button data-block="dot">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>

      <h2>工具</h2>
      <div class="toolbar">
        <button id="modePaint">填色模式</button>
        <button id="modeSelect" class="secondary">框选模式</button>
      </div>

      <h2>新建纹样块</h2>
      <div id="blockCreate" class="hidden">
        <label>纹样块名称</label>
        <input id="blockName" type="text" maxlength="20">
        <button id="saveBlockBtn" style="margin-top:8px">保存选框为纹样块</button>
      </div>
      <p class="muted" id="selectTip">切到框选模式，在画布上拖出矩形即可保存。</p>

      <h2>我的纹样块</h2>
      <div id="blockList" class="blocks"></div>

      <h2>铺放设置</h2>
      <div class="tile-form">
        <div>
          <label>横向次数</label>
          <input id="repeatX" type="number" value="3" min="1" max="60">
        </div>
        <div>
          <label>纵向次数</label>
          <input id="repeatY" type="number" value="3" min="1" max="60">
        </div>
        <div>
          <label>起点列（1 起）</label>
          <input id="startX" type="number" value="1" min="1">
        </div>
        <div>
          <label>起点行（1 起）</label>
          <input id="startY" type="number" value="1" min="1">
        </div>
        <button id="pickStartBtn" class="secondary wide">点画布取起点</button>
        <button id="tileBtn" class="wide" disabled>铺放到画布</button>
      </div>
    </aside>

    <section class="panel">
      <p class="hint" id="modeHint"></p>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>铺放整块只算一次撤销；越界格舍去，铺放范围外颜色不动。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/interact.js"></script>
</body>
</html>
